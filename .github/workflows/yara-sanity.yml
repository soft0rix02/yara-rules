name: YARA sanity trigger
on:
  push:
    paths: ["**/*.yar", "**/*.yara", ".yara-ci.yml"]
  pull_request:
    paths: ["**/*.yar", "**/*.yara", ".yara-ci.yml"]
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List changed files
        run: |
          echo "Event: $GITHUB_EVENT_NAME"
          echo "SHA: $GITHUB_SHA"
          git diff --name-only HEAD~1 | grep -E '\.ya?r$|\.yara$|\.yara-ci\.yml' || true
